name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# 同一分支的旧跑批自动取消，省额度
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------
  # 1) 核心承诺守卫：零强制依赖
  #    项目对外宣称"纯标准库即可跑通主链路"，那就必须有一条
  #    流水线真的什么都不装去验证它。否则这句承诺迟早悄悄失效。
  #    全程离线，不依赖任何网络。
  # ------------------------------------------------------------
  stdlib-only:
    name: 零依赖（不装任何第三方包）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # 记忆库必须导到临时目录：测试里分析的每一步都会写判断记录，
      # 落在仓库里就成了"假记忆"，而假记忆会被真的注入后续分析。
      DSA_MEMORY_DIR: ${{ runner.temp }}/dsa-memory
      # 辩论过程同理：跑一次回测就往仓库里灌几百条记录，没人愿意 review
      DSA_DEBATE_DIR: ${{ runner.temp }}/dsa-debate
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 确认环境确实干净
        run: |
          python - <<'PY'
          import importlib.util as u
          for mod in ("yaml", "tushare", "akshare", "baostock", "numpy", "pandas"):
              assert u.find_spec(mod) is None, f"{mod} 不该存在，零依赖测试已失效"
          print("环境干净：无任何第三方依赖 ✅")
          PY

      - name: 自检（验证「验证器」本身是否可信）
        run: python tests/selftest.py

      - name: 复权算法验收
        run: python tests/test_adjust.py

      - name: 时点门控验收
        run: python tests/test_lookahead.py

      - name: 反思记忆验收（重点：证明它不漏未来）
        run: python tests/test_memory.py

      - name: 多空辩论验收（重点：证明它不会失控）
        run: python tests/test_debate.py

      - name: 语法与导入检查
        run: python -m compileall -q main.py core tests

      - name: CLI 冒烟（--help 必须不报错）
        run: |
          python main.py --help
          python main.py doctor --help
          python main.py asof --help
          python main.py reflect --help
          python main.py memory --help
          python main.py debate --help
          python main.py analyze --help

      - name: 确认测试没有污染仓库
        run: |
          if [ -e data/memory ]; then
            echo "::error::测试往仓库里写了记忆文件："; ls -la data/memory
            exit 1
          fi
          if [ -e data/debate ]; then
            echo "::error::测试往仓库里写了辩论记录："; ls -la data/debate
            exit 1
          fi
          git diff --exit-code -- data/ledger/signals.csv \
            || { echo "::error::测试改动了已提交的信号台账"; exit 1; }
          echo "工作区干净，无测试残留 ✅"

  # ------------------------------------------------------------
  # 2) 多版本矩阵：3.10 是 requires-python 的下限，3.13 是当前
  # ------------------------------------------------------------
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DSA_MEMORY_DIR: ${{ runner.temp }}/dsa-memory
      DSA_DEBATE_DIR: ${{ runner.temp }}/dsa-debate
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 装可选依赖
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: 自检
        run: python tests/selftest.py

      - name: 复权算法验收
        run: python tests/test_adjust.py

      - name: 时点门控验收
        run: python tests/test_lookahead.py

      - name: 反思记忆验收
        run: python tests/test_memory.py

      - name: 多空辩论验收
        run: python tests/test_debate.py

      - name: 导入检查（有 pyyaml 时 config.yaml 走真实解析路径）
        run: |
          python -c "import core.asof, core.debate, core.backtest, core.fetchers, core.llm, core.memory, core.validator, core.strategies, core.indicators; print('imports ok')"
          python - <<'PY'
          import main
          cfg = main.load_config("config.yaml")
          assert cfg["strategy"], "config.yaml 未正确加载"
          assert cfg["fetcher_priority"], "fetcher_priority 缺失"
          assert cfg["strategy_params"]["debate"]["max_rounds"] >= 1, "debate 配置缺失"
          print("config.yaml 解析 ok →", cfg["strategy"], "|", " → ".join(cfg["fetcher_priority"]))
          PY

  # ------------------------------------------------------------
  # 3) 网络冒烟：验证真实行情源还能用
  #    独立成 job 且不阻塞 —— 上游接口挂掉是常态（东财有 IP 级限流），
  #    不该因为别人家的服务抖动就把自己的 CI 判红。
  # ------------------------------------------------------------
  network-smoke:
    name: 网络冒烟（真实数据源）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    env:
      DSA_MEMORY_DIR: ${{ runner.temp }}/dsa-memory
      DSA_DEBATE_DIR: ${{ runner.temp }}/dsa-debate
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 数据源体检
        run: python main.py doctor --skip-llm --skip-limited || true

      - name: 离线分析链路（不调 LLM）
        run: python main.py analyze --mock --no-notify --symbols sh600519,sz000858 --days-back 300

      - name: 辩论链路冒烟（演示命令必须能跑通）
        run: |
          echo "--- 跑一场辩论：两个顺序的裁决应当都打出来 ---"
          python main.py debate --symbol sh600519 --mock --days-back 200
          echo "--- 辩论进主链路（决策看板里应有「多空辩论」小节） ---"
          python main.py analyze --debate --mock --no-notify --symbols sh600519 --days-back 200

      - name: 反射链路冒烟（判断 → 记忆 → 结算）
        run: |
          echo "--- 刚写下的判断应处于验证期 ---"
          python main.py memory --symbol sh600519
          echo "--- 结算（新判断尚未到期，应报「验证期未走完」而不是报错） ---"
          python main.py reflect
          echo "--- reflect 必须可重复执行且不重复结算 ---"
          python main.py reflect

  # ------------------------------------------------------------
  # 4) 静态检查（不阻塞：风格问题不该拦住功能合并）
  # ------------------------------------------------------------
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
